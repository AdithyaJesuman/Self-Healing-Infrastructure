version: "3.8"

services:
  # --- Infrastructure Layer ---
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    restart: on-failure

  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: devpassword123
      DOCKER_INFLUXDB_INIT_ORG: aiops
      DOCKER_INFLUXDB_INIT_BUCKET: raw_metrics
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: devtoken123
    volumes:
      - influxdb-data:/var/lib/influxdb2

  neo4j:
    image: neo4j:5.15-community
    container_name: neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/devpassword123
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j-data:/data

  chromadb:
    image: chromadb/chroma:latest
    container_name: chromadb
    ports:
      - "8000:8000"
    volumes:
      - chromadb-data:/chroma/chroma

  grafana:
    image: grafana/grafana:10.2.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./services/dashboard/provisioning:/etc/grafana/provisioning
    depends_on:
      - influxdb

  # --- Application Services ---
  api-gateway:
    build: ./services/api-gateway
    container_name: api-gateway
    environment:
      - "KAFKA_BROKER=kafka:9092"
      - "INFLUXDB_URL=http://influxdb:8086"
      - "NEO4J_URL=bolt://neo4j:7687"
      - "CHROMADB_URL=http://chromadb:8000"
    ports:
      - "8001:8000"
    volumes:
      - ./services/api-gateway:/app
      - ./datasets:/app/datasets
    depends_on:
      - kafka
      - influxdb
      - neo4j
      - chromadb
    restart: on-failure

  command-center:
    image: node:20-alpine
    container_name: command-center
    working_dir: /app
    volumes:
      - ./services/command-center:/app
    ports:
      - "5173:5173"
    command: sh -c "npm run preview -- --host 0.0.0.0 --port 5173"
    depends_on:
      - api-gateway

  # --- Pipeline Microservice Daemons ---
  collector:
    build: ./services/collector
    container_name: collector
    environment:
      - "KAFKA_BROKER=kafka:9092"
      - "INFLUXDB_URL=http://influxdb:8086"
    depends_on:
      - kafka
      - influxdb
    restart: on-failure

  anomaly-detection:
    build: ./services/anomaly-detection
    container_name: anomaly-detection
    environment:
      - "KAFKA_BROKER=kafka:9092"
    depends_on:
      - kafka
    restart: on-failure

  multi-agent:
    build: ./services/multi-agent
    container_name: multi-agent
    environment:
      - "KAFKA_BROKER=kafka:9092"
    depends_on:
      - kafka
    restart: on-failure

  policy-engine:
    build: ./services/policy-engine
    container_name: policy-engine
    environment:
      - "KAFKA_BROKER=kafka:9092"
    depends_on:
      - kafka
    restart: on-failure

volumes:
  influxdb-data:
  neo4j-data:
  chromadb-data:
  grafana-data:
